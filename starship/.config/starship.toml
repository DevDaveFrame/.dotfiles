format = """
[╒═ ](bold #7aa2f7)\
$username\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$git_metrics\
$fill\
$gcloud\
$docker_context\
$cmd_duration\
$time\
[═╛](bold #7aa2f7)
[╰─ ](bold #7aa2f7)\
$character
"""

right_format = """
$python\
$c\
$golang\
$java\
$nodejs\
$rust
"""

# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Cold-cache dir scans (first prompt of a session) blow the 30ms default and
# suppress every detect_files/detect_folders module (docker_context, python, nodejs...).
# Budget, not a delay: no cost when the scan is fast.
scan_timeout = 250
# Use dirent type instead of stat() per entry. Symlinked dirs count as files.
follow_symlinks = false

# Palette: tokyonight (night) — matches nvim's tokyonight style = "night"
# bg #1a1b26  fg #c0caf5  comment #565f89  dark #414868
# blue #7aa2f7  cyan #7dcfff  blue1 #2ac3de  magenta #bb9af7  purple #9d7cd8
# green #9ece6a  teal #73daca  yellow #e0af68  orange #7aa2f7  red #f7768e

[fill]
symbol = "═"
style = "bold #7aa2f7"

# Disable the blank line at the start of the prompt
# add_newline = false

# You can also replace your username with a neat symbol like  to save some space
[username]
show_always = true
style_user = "bold #ff9e64"
style_root = "bold #f7768e"
format = '[$user/]($style)'

[directory]
style = "bold #7aa2f7"
read_only_style = "#ff9e64"
format = "[$path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Develop" = "󰲋 "
"Work" = " "
"divesite" = "󰷀"
"iCloud~md~obsidian" = ""

# Keep in mind that the order matters. For example:
# "Important Documents" = "  "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important  " = "  "

[c]
symbol = ""
format = '[$symbol ($version) ]($style)'

[docker_context]
symbol = ""
format = '[$symbol $context]($style)$path'
detect_files = ["Dockerfile", "docker-compose.local.yml", "docker-compose.yml"]
detect_folders = ["build"]

[gcloud]
symbol = ""
format = '[$symbol(\($project\))]($style)'

[git_branch]
symbol = ""
format = '[⦋](bold #7aa2f7)[$symbol $branch ](bold #9ece6a)'

[git_metrics]
added_style = 'bold blue'
format = '[+$added]($added_style)/[-$deleted]($deleted_style) '

[git_status]
format = '[$all_status$ahead_behind]($style)[⦌](bold #7aa2f7)'

[golang]
symbol = " "
format = ' [$symbol ($version)]($style)'

[java]
symbol = " "
style = "bg:#86BBD8"
format = ' [$symbol ($version)]($style)'

[nodejs]
symbol = "js "
format = ' [$symbol ($version)](dimmed green)'

[rust]
symbol = "rs "
format = ' [$symbol ($version)]($style)'

[python]
symbol = 'py '
pyenv_version_name = true
format = ' [$symbol ($version)](yellow)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
format = '[  $time ](#ff9e64)'

[cmd_duration]
min_time = 500
format = "took [$duration]($style)"

[character]
format = "[$symbol ]($style)"
success_symbol = "[](bold green)"
error_symbol = "[❯](bold red)"
